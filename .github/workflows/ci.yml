name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Format check
        # `cyrius fmt --check <file>` exits non-zero on drift and never rewrites the file. One
        # invocation per file, so every drifted file is reported before the step fails.
        run: |
          fail=0
          for f in src/*.cyr tests/*.tcyr programs/*.cyr; do
            [ -f "$f" ] || continue
            if ! out=$(cyrius fmt --check "$f" 2>&1); then
              echo "needs fmt: $f"
              [ -n "$out" ] && printf '%s\n' "$out" | sed 's/^/    /'
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected — run \`cyrius fmt <file>\`"; exit 1; }

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Coverage floor
        # Reference coverage (functions a test references) — a floor, not a correctness proof, and the
        # tool says so. Set at the measured 61% (624 of 1,015 fns) when the 0.17.x parity arc opened,
        # raised to the measured 63% (647 of 1,020) at 0.17.1; the arc's test bites raise it toward the
        # v1.0 criterion of 80%. Never lower it to make a red run green. Verified it can fail: `--min 64`
        # exits 1 on this tree.
        run: cyrius coverage --min 63
